name: Build and deploy download site

# Gitea Actions：推送 v* 标签或手动运行时，构建 Windows 包并同步下载站。
# Runner 要求（自建、Linux）：Rust + x86_64-pc-windows-msvc target、cargo-xwin、
# Python 3.11+、rsync、能访问 crates.io / 模型源，以及下面的 site secrets。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      notes:
        description: '更新说明（一行一条），留空则使用标签名'
        required: false
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Prepare source
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Gitea act runner 不会自动检出仓库；用内置 token 克隆当前 ref。
          if [ -f Cargo.toml ]; then
            echo "工作区已有源码"
            git log -1 --oneline
            exit 0
          fi
          server="${GITHUB_SERVER_URL#http://}"
          server="${server#https://}"
          scheme="http"
          case "$GITHUB_SERVER_URL" in
            https://*) scheme="https" ;;
          esac
          base="${scheme}://${server}/${GITHUB_REPOSITORY}.git"
          tmp="$(mktemp -d)"
          cloned=""
          clone_repo() {
            git clone --depth 1 --branch "${GITHUB_REF_NAME}" "$1" "$tmp/repo"
          }
          if [ -n "${TOKEN:-}" ]; then
            for user in "${GITHUB_ACTOR:-}" oauth2; do
              [ -z "$user" ] && continue
              echo "尝试用 ${user} + token 克隆 ${GITHUB_REF_NAME}"
              if clone_repo "${scheme}://${user}:${TOKEN}@${server}/${GITHUB_REPOSITORY}.git"; then
                cloned=1
                break
              fi
              rm -rf "$tmp/repo"
            done
          fi
          if [ -z "$cloned" ]; then
            echo "回退到匿名克隆 ${base}"
            clone_repo "$base"
          fi
          cp -a "$tmp/repo/." .
          rm -rf "$tmp"
          git log -1 --oneline

      - name: Set up Rust toolchain
        env:
          # 国内网络默认走 rsproxy 镜像；需要别的源就改这里。
          RUSTUP_DIST_SERVER: https://rsproxy.cn
          RUSTUP_UPDATE_ROOT: https://rsproxy.cn/rustup
        run: |
          # /cache 由 act_runner 的 container.options 挂载（见 README）。
          # 没有挂载时退回 $HOME，只能当前任务内有效。
          if [ -d /cache ] && [ -w /cache ]; then
            cache_root=/cache
            echo "使用持久化缓存：/cache"
          else
            cache_root="$HOME"
            echo "::warning::没有可写的 /cache，Cargo/Rust 不会跨任务持久化（当前用 $HOME）"
          fi
          mkdir -p "$cache_root/cargo" "$cache_root/rustup" "$cache_root/target" \
                   "$cache_root/xwin" "$cache_root/ort" "$cache_root/oar"
          {
            echo "CARGO_HOME=$cache_root/cargo"
            echo "RUSTUP_HOME=$cache_root/rustup"
            echo "CARGO_TARGET_DIR=$cache_root/target"
            echo "XWIN_CACHE_DIR=$cache_root/xwin"
            echo "ORT_CACHE_DIR=$cache_root/ort"
            echo "OAR_HOME=$cache_root/oar"
          } >> "$GITHUB_ENV"
          echo "$cache_root/cargo/bin" >> "$GITHUB_PATH"
          export CARGO_HOME="$cache_root/cargo"
          export RUSTUP_HOME="$cache_root/rustup"
          export PATH="$CARGO_HOME/bin:$PATH"

          python3 --version
          if ! command -v cargo >/dev/null 2>&1; then
            echo "未检测到 Rust，安装 stable（镜像：$RUSTUP_DIST_SERVER，目录：$CARGO_HOME）"
            if command -v curl >/dev/null 2>&1; then
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
                sh -s -- -y --profile minimal --default-toolchain stable
            else
              wget -qO- https://sh.rustup.rs |
                sh -s -- -y --profile minimal --default-toolchain stable
            fi
            # shellcheck disable=SC1091
            . "$CARGO_HOME/env"
          fi
          cargo --version
          rustup target list --installed | grep -q x86_64-pc-windows-msvc ||
            rustup target add x86_64-pc-windows-msvc
          if ! command -v cargo-xwin >/dev/null 2>&1; then
            echo "安装 cargo-xwin"
            cargo install cargo-xwin --locked
          fi
          command -v rsync >/dev/null 2>&1 || {
            echo "安装 rsync"
            (command -v sudo >/dev/null 2>&1 && sudo apt-get update && sudo apt-get install -y rsync) ||
              (apt-get update && apt-get install -y rsync)
          }

      - name: Build Windows package
        run: bash scripts/package-windows.sh

      - name: Build download site
        env:
          VERSION: ${{ github.ref_name }}
          MANUAL_NOTES: ${{ github.event.inputs.notes }}
        run: |
          if [ -s site/notes.txt ]; then
            python3 scripts/build-site.py --notes-file site/notes.txt
          elif [ -n "${MANUAL_NOTES:-}" ]; then
            python3 scripts/build-site.py --notes "$MANUAL_NOTES"
          else
            python3 scripts/build-site.py --notes "常规更新与修复。"
          fi

      - name: Deploy to website
        env:
          SITE_SSH_HOST: ${{ secrets.SITE_SSH_HOST }}
          SITE_SSH_USER: ${{ secrets.SITE_SSH_USER }}
          SITE_SSH_PORT: ${{ secrets.SITE_SSH_PORT }}
          SITE_SSH_KEY: ${{ secrets.SITE_SSH_KEY }}
          SITE_PATH: ${{ secrets.SITE_PATH }}
        run: |
          if [ -z "$SITE_SSH_HOST" ]; then
            echo "::warning::未配置 SITE_SSH_HOST，跳过部署（站点在 dist/site）"
            exit 0
          fi
          if [ -n "$SITE_SSH_KEY" ]; then
            install -m 700 -d ~/.ssh
            printf '%s\n' "$SITE_SSH_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            export SITE_SSH_KEY="$HOME/.ssh/deploy_key"
          fi
          bash scripts/deploy-site.sh dist/site
