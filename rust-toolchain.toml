# 固定 Rust 工具链版本。
#
# CI 用 `cargo clippy -- -D warnings` 卡发布，而 stable 一升级就可能冒出新 lint
# 把发布构建打断（例如 1.97 新增的 missing_const_for_thread_local，直接让
# Windows 打包阶段红掉）。锁住版本后，升级是一次显式改动，而不是某天突然失败。
[toolchain]
channel = "1.97.1"
components = ["rustfmt", "clippy"]
# 交叉编译 Windows 包需要；Linux / macOS 上开发时也会顺带装好。
targets = ["x86_64-pc-windows-msvc"]
