[package]
name = "rust-mhxy"
version = "0.2.14"
edition = "2021"
description = "梦幻西游抓鬼/鬼王任务坐标辅助（Rust + egui）"
license = "MIT"

[[bin]]
name = "rust-mhxy"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "glow",
    "links",
    "wayland",
    "x11",
] }
egui = "0.36"
image = "0.25"
json5 = "0.4"
memmap2 = "0.9"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
oar-ocr = { version = "0.10", features = ["auto-download"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(windows))'.dependencies]
xcap = "0.9"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[build-dependencies]
winresource = "0.1.34"
