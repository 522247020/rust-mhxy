name: CI

# 日常提交的快速门禁：格式 / clippy / 测试。
# Windows 打包与发布仍然只在推 v* 标签时由 windows.yml 负责；这里用的是 Linux
# 跑得最快的组合（和 .gitea/workflows/site.yml 里那段 clippy + test 一致）。
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'site/**'
      - '**.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      ORT_CACHE_DIR: ${{ github.workspace }}/.ort-cache
      OAR_HOME: ${{ github.workspace }}/.ocr-models
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Rust
        # 用 stable：仓库里不钉版本（见 Cargo.toml 的说明），这里补上 fmt / clippy 组件。
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ci-linux-x86_64
          cache-on-failure: true

      - name: Cache ONNX Runtime and OCR models
        uses: actions/cache@v5
        with:
          path: |
            .ort-cache
            .ocr-models
          key: linux-ocr-${{ hashFiles('Cargo.lock') }}
          # 命中不了也要退到上一份缓存：key 里含 Cargo.lock，版本号一改就会 miss，
          # 而 ort-sys 在缓存缺东西时是直接 panic（不会安静地重新下载运行库）。
          restore-keys: |
            linux-ocr-

      - name: Install native build dependencies
        # xcap 需要 pipewire；eframe/winit 需要 egl/gl/wayland/xkb；中文字体供字体测试用。
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libpipewire-0.3-dev libegl1-mesa-dev libgl1-mesa-dev \
            libgbm-dev libdrm-dev libxkbcommon-dev libwayland-dev libx11-dev \
            libxcb1-dev fonts-wqy-microhei

      - name: Check formatting
        run: cargo fmt --check

      - name: Check Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked
